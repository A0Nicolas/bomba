services:
  mysql:
    image: mysql:5.7  # CAMBIADO a MySQL 5.7 (más ligero)
    container_name: cotizaciones_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sistema_cotizaciones
      MYSQL_USER: admin
      MYSQL_PASSWORD: espe2026
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    # Configuración para bajo recursos
    command: 
      - --innodb-buffer-pool-size=64M
      - --max-connections=10
      - --key_buffer_size=16M
      - --query_cache_size=0
      - --performance_schema=0
    cpus: 0.3
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cotizaciones_net

  php:
    build: .
    container_name: cotizaciones_php
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html/
    depends_on:
      mysql:
        condition: service_healthy
    cpus: 0.3
    mem_limit: 256m
    networks:
      - cotizaciones_net

networks:
  cotizaciones_net:
    driver: bridge

volumes:
  mysql_data: